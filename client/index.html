<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Tahia's personal watch library — everything watched, watching, abandoned and waiting." />
    <meta name="theme-color" content="#3C3458" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Tahia's Watch List</title>

    <!-- Fonts: Fredoka (bubble title + headings), Chewy (buttons), Nunito (body text) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chewy&family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Apply the saved theme before React loads so the page never flashes the wrong colors. -->
    <script>
      try {
        var saved = localStorage.getItem("twl-theme");
        if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
